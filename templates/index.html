        }

        @font-face{

            font-weight: 200;
            font-style: italic;
            font-display: swap;
        }

        @font-face{
            font-family: 'calvino';
            src: url(/static/fonts/Calvino-Regular-trial.ttf) format('truetype');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face{
            font-family: 'calvino';
            src: url(/static/fonts/Calvino-Extrabold-trial.ttf) format('truetype');
            font-weight: 400;
            font-style: normal;

        }

        @font-face{

            font-weight: 400;

            font-display: swap;
        }

        @font-face{
            font-family: 'calvino';
            src: url(/static/fonts/Calvino-Bold-trial.ttf) format('truetype');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face{
            font-family: 'calvino';
            src: url(/static/fonts/Calvino-Bold-Italic-trial.ttf) format('truetype');
            font-weight: 500;
            font-style: italic;
            font-display: swap;
        }
    </style>
</head>
<body style="padding: 0; margin: 0; background-color: #fdecbd; font-family: 'calvino', sans-serif;">
    <div id="main" style="background-color: #fdecbd; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 60px;">
        <div id="nav">
            <nav>

            </nav>
        </div>
        <div id="hero" style="display: flex; flex-direction: column; align-items: center; gap: 0;">
            <div class="logo-mask" style="width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                <img src="/static/logo-512.png" alt="" style="width: 212px; height: 212px;">
            </div>
            <h1 style="color: #ff8a00; font-weight:300; text-align: center; font-size: 2rem; line-height: 1;" > <span style="font-weight: 500; font-size: 3.3rem;"> TELOS </span> <br>finds the purpose behind <br> what you keep</h1>
        </div>
        <div id="content" style="display: flex; flex-direction: column; align-items: center; gap: 0px;">
            <h3 style="color: #924e00;">Send URL to Flask API</h3>
    
            <input type="url" id="url-input" value="{{ prefill_url|default('' )}}" placeholder="https://example.com" style="width: 300px; padding: 5px; border-radius: 10px; border: none;">
            <button id="submit-btn" style="padding: 5px 10px; background-color: #ff8a00; margin-top: 10px; border: transparent; border-radius: 6px;">Analyze URL</button>

            <pre id="output-box" style="background: #b46307; padding: 15px; height: fit-content; width: 80%; white-space: pre-wrap; color: white; font-family: 'calvino', sans-serif; font-weight: 100;"></pre>

        </div>
    </div>
    
    <script>
        if('serviceWorker' in navigator){
            navigator.serviceWorker.register('/static/sw.js');
        }

        document.getElementById('submit-btn').addEventListener('click', (e) => {
            const rUrl = document.getElementById('url-input').value;
            const outputBox = document.getElementById('output-box');

            const btn = e.currentTarget;
            btn.disabled = true;
            btn.innerText = 'Analyzing....';

            if(!rUrl){
                outputBox.innerHTML = "Please enter the URL first";
                btn.disabled = false;
                btn.innerText = 'Analyze URL'
                return
            }

            outputBox.innerHTML = "Processing...";
            targetUrl = "http://127.0.0.1:5000";
            fetch('/process', {
                method: 'POST',
                headers: {
                    'content-type': 'application/json'
                },
                body: JSON.stringify({ url: rUrl})
            })
            .then(response => response.json())
            .then(data => {
                const outputResult = data.Output;
                outputBox.innerText = outputResult
                btn.disabled = false;
                btn.innerText = 'Analyze URL'
            })
            .catch(error => {
                console.error('Error : ', error);
                outputBox.innerHTML = "An Error Ocured While Connecting to API"
                btn.disabled = false;
                btn.innerText = 'Analyze URL'
            });
        });
    </script>
</body>
</html>
